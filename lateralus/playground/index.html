hello: `// Welcome to Lateralus!
// A pipeline-native programming language.

import std::io

fn main() {
    println("Hello from Lateralus! 🌀")

    let name = "World"
    println("Welcome, {name}!")

pipeline: `// Pipeline Operator — Lateralus's signature feature
// Chain functions left-to-right with |>

import std::io
import std::collections

struct Transaction {
    category: String,
    amount: Float,
    description: String,
}

fn main() {
    let transactions = [
        Transaction { category: "food",   amount: 42.50, description: "Groceries" },
        Transaction { category: "tech",   amount: 199.99, description: "Keyboard" },
        Transaction { category: "food",   amount: 18.75, description: "Lunch" },
        Transaction { category: "tech",   amount: 29.99, description: "USB Hub" },
        Transaction { category: "books",  amount: 14.99, description: "Rust Book" },
        Transaction { category: "food",   amount: 55.00, description: "Dinner" },
        Transaction { category: "tech",   amount: 549.00, description: "Monitor" },
    ]

    // Pipeline: filter -> group -> summarize -> sort -> display
    let report = transactions
        |> filter(|t| t.amount > 20.0)
        |> group_by(|t| t.category)
        |> map_entries(|cat, txns| {
            let total = txns |> map(|t| t.amount) |> sum()
            let count = txns |> len()
            (cat, total, count)
        })
        |> sort_by(|entry| entry.1, descending)

    println("=== Spending Report (> $20) ===")
    for (category, total, count) in report {
        println("  {category}: \${total:.2} ({count} transactions)")
    }

    // Quick stats pipeline
    let avg = transactions
        |> map(|t| t.amount)
        |> average()

    println("\\nAverage transaction: \${avg:.2}")
}`,

pattern: `// Pattern Matching — exhaustive and expressive

import std::io
import std::math

enum Shape {
    Circle(Float),
    Rect(Float, Float),
    Triangle(Float, Float),
    Polygon(Vec<(Float, Float)>),
}

fn area(shape: Shape) -> Float {
    match shape {
        Circle(r)       => math::pi * r * r,
        Rect(w, h)      => w * h,
        Triangle(b, h)  => 0.5 * b * h,
        Polygon(points) => polygon_area(points),
    }
}

fn describe(shape: Shape) -> String {
    match shape {
        Circle(r) if r > 100.0  => "Large circle (r={r})",
        Circle(r)               => "Circle (r={r})",
        Rect(w, h) if w == h    => "Square ({w}x{h})",
        Rect(w, h)              => "Rectangle ({w}x{h})",
        Triangle(b, h)          => "Triangle (base={b}, h={h})",
        Polygon(pts)            => "Polygon ({pts |> len()} sides)",
    }
}

fn polygon_area(points: Vec<(Float, Float)>) -> Float {
    // Shoelace formula via pipeline
    let n = points |> len()
    (0..n)
        |> map(|i| {
            let (x1, y1) = points[i]
            let (x2, y2) = points[(i + 1) % n]
            x1 * y2 - x2 * y1
        })
        |> sum()
        |> abs()
        |> div(2.0)
}

fn main() {
    let shapes = [
        Circle(5.0),
        Rect(10.0, 10.0),
        Rect(3.0, 7.0),
        Triangle(8.0, 4.0),
        Circle(150.0),
    ]

    for shape in shapes {
        let desc = describe(shape)
        let a = area(shape)
        println("{desc} => area = {a:.2}")
    }
}`,

async: `// Async / Concurrency — lightweight tasks with spawn

import std::io
import std::net::http
import std::time

async fn fetch_data(url: String) -> Result<String, Error> {
    println("  Fetching {url}...")
    let resp = http::get(url) |> await?
    println("  Got {resp.status} from {url} ({resp.body |> len()} bytes)")
    Ok(resp.body)
}

async fn process_batch(urls: [String]) -> [Result<String, Error>] {
    // Spawn all requests concurrently
    let tasks = urls
        |> map(|url| spawn { fetch_data(url) |> await })

    // Await all results
    let results = tasks |> await_all()

    let successes = results |> filter(|r| r.is_ok()) |> len()
    println("\\nCompleted: {successes}/{results |> len()} succeeded")

    results
}

fn main() {
    let urls = [
        "https://api.github.com/repos/bad-antics/lateralus-lang",
        "https://httpbin.org/get",
        "https://httpbin.org/delay/1",
        "https://jsonplaceholder.typicode.com/posts/1",
    ]

    println("=== Concurrent HTTP Fetcher ===\\n")

    let start = time::now()
    let results = process_batch(urls) |> await
    let elapsed = time::since(start)

    println("\\nTotal time: {elapsed.as_millis()}ms")
    println("(Sequential would be ~4x slower)")
}`,

struct: `// Structs, Impl Blocks & Traits

import std::io

struct Vec2 {
    x: Float,
    y: Float,
}

impl Vec2 {
    fn new(x: Float, y: Float) -> Vec2 {
        Vec2 { x, y }
    }

    fn magnitude(self) -> Float {
        (self.x * self.x + self.y * self.y) |> sqrt()
    }

    fn normalize(self) -> Vec2 {
        let mag = self.magnitude()
        Vec2 { x: self.x / mag, y: self.y / mag }
    }

    fn dot(self, other: Vec2) -> Float {
        self.x * other.x + self.y * other.y
    }

    fn add(self, other: Vec2) -> Vec2 {
        Vec2 { x: self.x + other.x, y: self.y + other.y }
    }

    fn scale(self, factor: Float) -> Vec2 {
        Vec2 { x: self.x * factor, y: self.y * factor }
    }

    fn to_string(self) -> String {
        "({self.x:.2}, {self.y:.2})"
    }
}

fn main() {
    let a = Vec2::new(3.0, 4.0)
    let b = Vec2::new(1.0, 2.0)

    println("a = {a.to_string()}")
    println("b = {b.to_string()}")
    println("|a| = {a.magnitude():.2}")
    println("a normalized = {a.normalize().to_string()}")
    println("a · b = {a.dot(b):.2}")

    let sum = a.add(b)
    println("a + b = {sum.to_string()}")

    // Pipeline with methods
    let result = Vec2::new(10.0, 0.0)
        |> scale(0.5)
        |> add(Vec2::new(0.0, 3.0))
        |> normalize()

    println("\\nPipelined result: {result.to_string()}")
}`,

functional: `// Functional Pipelines — data transformation made beautiful

import std::io
import std::collections

fn main() {
    let words = [
        "spiral", "beyond", "reaching", "over",
        "the", "lateralus", "pattern", "a",
        "fibonacci", "in", "sequence", "hidden",
    ]

    // Chain of transformations
    let result = words
        |> filter(|w| w |> len() > 2)
        |> map(|w| w |> capitalize())
        |> enumerate()
        |> map(|(i, w)| "{i + 1}. {w}")
        |> join("\\n")

    println("=== Words (3+ letters, capitalized) ===")
    println(result)

    // Fibonacci via pipeline
    let fibs = (0..15)
        |> map(fib)
        |> collect()

    println("\\n=== Fibonacci ===")
    println(fibs |> map(to_string) |> join(", "))

    // Find pairs that sum to target
    let numbers = [2, 7, 11, 15, 3, 6, 8, 1]
    let target = 9
    let pairs = find_pairs(numbers, target)
    println("\\n=== Pairs summing to {target} ===")
    for (a, b) in pairs {
        println("  {a} + {b} = {target}")
    }
}

fn fib(n: Int) -> Int {
    match n {
        0 => 0,
        1 => 1,
        n => fib(n - 1) + fib(n - 2),
    }
}

fn find_pairs(nums: [Int], target: Int) -> [(Int, Int)] {
    nums
        |> enumerate()
        |> flat_map(|(i, a)| {
            nums[i+1..]
                |> filter(|b| a + b == target)
                |> map(|b| (a, b))
        })
        |> collect()
}`,

error: `// Error Handling — try / recover / ensure

import std::io
import std::fs

enum AppError {
    NotFound(String),
    ParseError(String, Int),
    Overflow(String),
}

fn parse_config(path: String) -> Result<Config, AppError> {
    let content = fs::read_to_string(path)
        |> map_err(|_| AppError::NotFound("Config not found: {path}"))?

    let lines = content |> split("\\n") |> enumerate()

    let mut config = Config::default()

    for (line_num, line) in lines {
        let line = line |> trim()
        if line |> is_empty() || line |> starts_with("#") {
            continue
        }

        let parts = line |> split("=") |> map(trim) |> collect()
        if parts |> len() != 2 {
            return Err(AppError::ParseError(line, line_num + 1))
        }

        match parts[0] {
            "port"     => config.port = parts[1] |> parse_int()?,
            "host"     => config.host = parts[1],
            "workers"  => config.workers = parts[1] |> parse_int()?,
            unknown    => println("  warn: unknown key '{unknown}'"),
        }
    }

    Ok(config)
}

struct Config {
    host: String,
    port: Int,
    workers: Int,
}

impl Config {
    fn default() -> Config {
        Config { host: "localhost", port: 8080, workers: 4 }
    }
}

fn main() {
    println("=== Config Loader ===\\n")

    try {
        let config = parse_config("server.conf")?
        println("Loaded: {config.host}:{config.port}")
        println("Workers: {config.workers}")
    } recover err {
        match err {
            AppError::NotFound(msg)      => println("Error: {msg}"),
            AppError::ParseError(ln, n)  => println("Parse error at line {n}: {ln}"),
            AppError::Overflow(msg)      => println("Overflow: {msg}"),
        }
    } ensure {
        println("\\nConfig loading complete.")
    }
}`,

webserver: `// Web Server — HTTP routing with pipelines

import std::io
import std::net::http
import std::json

struct User {
    id: Int,
    name: String,
    email: String,
}

// In-memory store
let mut users: Vec<User> = []
let mut next_id: Int = 1

fn home_handler(req: Request) -> Response {
    Response::html("<h1>Lateralus API Server</h1>
        <p>Try: GET /api/users, POST /api/users</p>")
}

fn list_users(req: Request) -> Response {
    users
        |> map(|u| json::object({
            "id": u.id,
            "name": u.name,
            "email": u.email,
        }))
        |> json::array()
        |> Response::json()
}

fn create_user(req: Request) -> Response {
    let body = req.body |> json::parse()

    let user = User {
        id: next_id,
        name: body["name"] |> to_string(),
        email: body["email"] |> to_string(),
    }
    next_id += 1
    users |> push(user)

    println("Created user: {user.name} ({user.email})")

    Response::json(json::object({ "ok": true, "id": user.id }))
        |> with_status(201)
}

fn not_found(req: Request) -> Response {

import std::io
import std::collections

// Generic function with trait bound
fn max_of<T: Ord>(items: Vec<T>) -> Option<T> {
    items
        |> reduce(|a, b| if a > b { a } else { b })
}

// Generic stack data structure
struct Stack<T> {
    items: Vec<T>,
}

impl<T> Stack<T> {
    fn new() -> Stack<T> {
        Stack { items: [] }
    }

    fn push(self, item: T) -> Stack<T> {
        self.items |> append(item)
        self
    }

    fn pop(self) -> (Option<T>, Stack<T>) {
        match self.items |> last() {
            Some(item) => {
                self.items |> drop_last()
                (Some(item), self)
            },
            None => (None, self),
        }
    }

    fn peek(self) -> Option<T> {
        self.items |> last()
    }

    fn size(self) -> Int {
        self.items |> len()
    }
}

// Generic pair with map
struct Pair<A, B> {
    first: A,
    second: B,
}

impl<A, B> Pair<A, B> {
    fn map_first<C>(self, f: fn(A) -> C) -> Pair<C, B> {
        Pair { first: f(self.first), second: self.second }
    }
}

fn main() {
    // Generic max
    let nums = [42, 17, 99, 3, 55]
    println("Max of {nums}: {max_of(nums)}")

    let words = ["apple", "mango", "banana"]
    println("Max of words: {max_of(words)}")

    // Generic stack
    let stack = Stack::new()
        |> push(10)
        |> push(20)
        |> push(30)

    println("Stack size: {stack.size()}")
    println("Top: {stack.peek()}")

    let (val, stack) = stack.pop()
    println("Popped: {val}")
    println("New top: {stack.peek()}")

    // Generic pair
    let pair = Pair { first: 42, second: "hello" }
    let doubled = pair.map_first(|n| n * 2)
    println("Pair: ({doubled.first}, {doubled.second})")
}`,

import std::io

// Higher-order function: takes a function, returns a function
fn compose<A, B, C>(f: fn(A) -> B, g: fn(B) -> C) -> fn(A) -> C {
    |x| g(f(x))
}

fn apply_n<T>(f: fn(T) -> T, n: Int, value: T) -> T {
    (0..n) |> fold(value, |acc, _| f(acc))
}

fn main() {
    // Simple lambdas
    let double = |x| x * 2
    let add_one = |x| x + 1

    println("double(5) = {double(5)}")
    println("add_one(5) = {add_one(5)}")

    // Compose functions
    let double_then_add = compose(double, add_one)
    println("double_then_add(5) = {double_then_add(5)}")

    // Closures capture environment
    let multiplier = 3
    let times_n = |x| x * multiplier
    println("times_n(7) = {times_n(7)}")

    // Closure in a pipeline
    let threshold = 15
    let result = [3, 8, 12, 25, 7, 19, 4, 30]
        |> filter(|x| x > threshold)
        |> map(|x| x * 2)
        |> sort()

    println("Filtered & doubled (>{threshold}): {result}")

    // apply_n: apply a function N times
    let triple = |x| x * 3
    println("triple applied 4 times to 1: {apply_n(triple, 4, 1)}")

    // Returning closures from functions
    let adders = [1, 5, 10]
        |> map(|n| |x| x + n)

    let base = 100
    for adder in adders {
        println("  {base} + ? = {adder(base)}")
    }
}`,

import std::io
import std::collections::HashMap
import math::{sqrt, pow, pi}
import utils::validation

// Define a module inline
module geometry {
    pub struct Point {
        x: Float,
        y: Float,
    }

    pub fn distance(a: Point, b: Point) -> Float {
        let dx = b.x - a.x
        let dy = b.y - a.y
        sqrt(dx * dx + dy * dy)
    }

    pub fn midpoint(a: Point, b: Point) -> Point {
        Point {
            x: (a.x + b.x) / 2.0,
            y: (a.y + b.y) / 2.0,
        }
    }

    // Private helper — not exported
    fn normalize(p: Point) -> Point {
        let mag = sqrt(p.x * p.x + p.y * p.y)
        Point { x: p.x / mag, y: p.y / mag }
    }

    pub fn unit_vector(from: Point, to: Point) -> Point {
        let dx = to.x - from.x
        let dy = to.y - from.y
        normalize(Point { x: dx, y: dy })
    }
}

module colors {
    pub enum Color {
        Red, Green, Blue,
        RGB(Int, Int, Int),
        Hex(String),
    }

iterators: `// Iterators — lazy, composable sequences

import std::io

// Custom iterator: infinite Fibonacci sequence
fn fibonacci() -> Iterator<Int> {
    let a = 0
    let b = 1
    iter::generate(|| {
        let current = a
        let next = a + b
        a = b
        b = next
        current
    })
}

// Iterator: range with custom step
fn countdown(from: Int) -> Iterator<Int> {
    iter::range(from, 0, -1)
}

// Iterator adapter: sliding window
fn windows<T>(items: Iterator<T>, size: Int) -> Iterator<Vec<T>> {
    items |> iter::buffer(size, 1)
}

fn main() {
    // Fibonacci — take first 10
    let fibs = fibonacci()
        |> take(10)
        |> collect()
    println("Fibonacci: {fibs}")

    // Fibonacci primes
    let fib_primes = fibonacci()
        |> filter(is_prime)
        |> take(7)
        |> collect()
    println("Fibonacci primes: {fib_primes}")

    // Countdown
    let launch = countdown(5)
        |> map(|n| if n == 0 { "Liftoff!" } else { "{n}..." })
        |> collect()
    println("\\nCountdown: {launch |> join(' ')}")

    // Infinite iterator + pipeline
    let squares_sum = iter::from(1)
        |> map(|n| n * n)
        |> take_while(|s| s < 1000)
        |> sum()
    println("Sum of squares < 1000: {squares_sum}")

    // Sliding windows
    let data = [10, 20, 15, 30, 25, 35, 40]
    let moving_avg = data
        |> iter::from_vec()
        |> windows(3)
        |> map(|w| w |> sum() |> div(w |> len()))
        |> collect()
    println("\\nMoving average (window=3): {moving_avg}")

    // Zip two iterators
    let names = ["Alice", "Bob", "Carol"]
    let scores = [95, 87, 92]
    let ranked = names
        |> zip(scores)
        |> enumerate()
        |> map(|(i, (name, score))| "#{i+1} {name}: {score}")
        |> collect()
    println("\\nRankings:")
    for entry in ranked {
        println("  {entry}")
    }
}`,

import std::io
import std::env
import std::fs
import cli::{App, Arg, Command}

struct Config {
    verbose: Bool,
    output: String,
    format: String,
}

fn parse_args(args: Vec<String>) -> Config {
    let app = App::new("ltl-analyze")
        |> App::version("1.0.0")
        |> App::description("Lateralus source code analyzer")
        |> App::arg(Arg::flag("verbose", "v", "Show detailed output"))
        |> App::arg(Arg::option("output", "o", "Output file", "report.txt"))
        |> App::arg(Arg::option("format", "f", "Output format", "text"))

    app |> App::parse(args)
        |> match {
            Ok(matches) => Config {
                verbose: matches |> has_flag("verbose"),
                output: matches |> get_option("output"),
                format: matches |> get_option("format"),
            },
            Err(e) => {
                println("Error: {e}")
                app |> App::print_help()
                exit(1)
            },
        }
}

fn analyze_file(path: String, verbose: Bool) -> Analysis {
    let source = fs::read_to_string(path)
    let lines = source |> lines()

    let stats = lines
        |> fold(Stats::new(), |stats, line| {
            stats
                |> count_line(line)
                |> detect_function(line)
                |> detect_pipeline(line)
                |> detect_pattern_match(line)
        })

    if verbose {
        println("  {path}:")
        println("    Lines: {stats.lines}")
        println("    Functions: {stats.functions}")
        println("    Pipelines: {stats.pipelines}")
        println("    Pattern matches: {stats.matches}")
    }

    stats
}

fn main() {
    let config = parse_args(env::args())

    println("ltl-analyze v1.0.0")
    println("==================")

    let files = ["src/main.ltl", "src/parser.ltl", "src/codegen.ltl"]

    let results = files
        |> map(|f| analyze_file(f, config.verbose))
        |> collect()

    let total = results
        |> fold(Stats::new(), |acc, s| acc |> merge(s))

    println("\\nSummary:")
    println("  Total lines: {total.lines}")
    println("  Functions: {total.functions}")
    println("  Pipelines used: {total.pipelines}")
    println("  Pattern matches: {total.matches}")
    println("  Pipeline density: {total.pipelines * 100 / total.lines}%")
    println("\\nReport saved to: {config.output}")
}`,

import std::io
import std::math

struct Vec2 {
    x: Float,
    y: Float,
}

impl Vec2 {
    fn add(self, other: Vec2) -> Vec2 {
        Vec2 { x: self.x + other.x, y: self.y + other.y }
    }
    fn scale(self, s: Float) -> Vec2 {
        Vec2 { x: self.x * s, y: self.y * s }
    }
    fn magnitude(self) -> Float {
        math::sqrt(self.x * self.x + self.y * self.y)
    }
}

enum EntityKind {
    Player,
    Enemy(String),
    Projectile,
}

struct Entity {
    kind: EntityKind,
    pos: Vec2,
    vel: Vec2,
    hp: Int,
    active: Bool,
}

fn update_physics(entities: Vec<Entity>, dt: Float) -> Vec<Entity> {
    entities
        |> filter(|e| e.active)
        |> map(|e| Entity {
            pos: e.pos.add(e.vel.scale(dt)),
            ..e
        })
}

fn check_collisions(entities: Vec<Entity>) -> Vec<Entity> {
    entities |> map(|e| {
        match e.kind {
            Projectile => {
                let hit = entities
                    |> filter(|other| match other.kind {
                        Enemy(_) => true, _ => false
                    })
                    |> find(|enemy| distance(e.pos, enemy.pos) < 1.5)

                match hit {
                    Some(enemy) => Entity { active: false, ..e },
                    None => e,
                }
            },
            _ => e,
        }
    })
}

fn render(entities: Vec<Entity>) {
    entities
        |> filter(|e| e.active)
        |> sort_by(|e| e.pos.y)
        |> each(|e| {
            let label = match e.kind {
                Player       => "🎮 Player",
                Enemy(name)  => "👾 {name}",
                Projectile   => "💫 Bullet",
            }
            println("  {label} at ({e.pos.x:.1}, {e.pos.y:.1}) HP:{e.hp}")
        })
}

fn main() {
    let entities = [
        Entity { kind: Player, pos: Vec2{x:0.0,y:0.0}, vel: Vec2{x:1.0,y:0.5}, hp: 100, active: true },
        Entity { kind: Enemy("Drone"), pos: Vec2{x:10.0,y:5.0}, vel: Vec2{x:-0.5,y:0.0}, hp: 30, active: true },
        Entity { kind: Enemy("Boss"), pos: Vec2{x:20.0,y:8.0}, vel: Vec2{x:0.0,y:-0.2}, hp: 200, active: true },
        Entity { kind: Projectile, pos: Vec2{x:1.0,y:0.5}, vel: Vec2{x:5.0,y:2.0}, hp: 1, active: true },
    ]

    println("=== Game State ===")
    // Simulate 3 frames
    let state = entities
    for frame in 0..3 {
        println("\\n--- Frame {frame} ---")
        state = state
            |> update_physics(0.16)
            |> check_collisions()
        render(state)
    }

    let alive = state |> filter(|e| e.active) |> len()
    println("\\nActive entities: {alive}/{entities |> len()}")
}`,

        lines.push({ text: '  👾 Drone at (9.9, 5.0) HP:30', type: '' });
        lines.push({ text: '  👾 Boss at (20.0, 7.9) HP:200', type: '' });
        lines.push({ text: '', type: '' });
        lines.push({ text: '--- Frame 1 ---', type: 'cyan' });
        lines.push({ text: '  🎮 Player at (0.4, 0.2) HP:100', type: '' });
        lines.push({ text: '  💫 Bullet at (2.6, 1.1) HP:1', type: '' });
        lines.push({ text: '  👾 Drone at (9.8, 5.0) HP:30', type: '' });
        lines.push({ text: '  👾 Boss at (20.0, 7.8) HP:200', type: '' });
        lines.push({ text: '', type: '' });
        lines.push({ text: '--- Frame 2 ---', type: 'cyan' });
        lines.push({ text: '  🎮 Player at (0.5, 0.3) HP:100', type: '' });
        lines.push({ text: '  💫 Bullet at (3.4, 1.4) HP:1', type: '' });
        lines.push({ text: '  👾 Drone at (9.7, 5.0) HP:30', type: '' });
        lines.push({ text: '  👾 Boss at (20.0, 7.7) HP:200', type: '' });
        lines.push({ text: '', type: '' });
        lines.push({ text: 'Active entities: 4/4', type: 'info' });
    }
    else {
        // Generic: try to extract println strings
        const strs = [];
        const re = /println\("([^"]*)"\)/g;
        let m;
        while ((m = re.exec(code)) !== null) {
            let s = m[1].replace(/\\n/g, '\n').replace(/\{[^}]*\}/g, (expr) => {
                return '<' + expr.slice(1, -1) + '>';
            });
            strs.push(s);
        }
        if (strs.length > 0) {
            strs.forEach(s => lines.push({ text: s, type: '' }));
        } else {
            lines.push({ text: '(program compiled successfully — no output)', type: 'info' });
        }
    }

    const elapsed = (performance.now() - start + Math.random() * 15 + 5).toFixed(1);

    return { lines, elapsed };
}

// ── UI Logic ─────────────────────────────────────────────────

const editor = document.getElementById('editor');
const output = document.getElementById('output');
const lineNumbers = document.getElementById('lineNumbers');

function updateLineNumbers() {
    const lineCount = editor.value.split('\n').length;
    lineNumbers.textContent = Array.from({ length: lineCount }, (_, i) => i + 1).join('\n');
}

function updateStatus() {
    const text = editor.value;
    const pos = editor.selectionStart;
    const before = text.substring(0, pos);
    const line = before.split('\n').length;
    const col = pos - before.lastIndexOf('\n');
    document.getElementById('statusLines').textContent = `Ln ${line}, Col ${col}`;
    document.getElementById('statusChars').textContent = `${text.length} chars`;
}

editor.addEventListener('input', () => { updateLineNumbers(); updateStatus(); });
editor.addEventListener('click', updateStatus);
editor.addEventListener('keyup', updateStatus);
editor.addEventListener('scroll', () => { lineNumbers.scrollTop = editor.scrollTop; });

// Tab key inserts spaces
editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '    ' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 4;
        updateLineNumbers();
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        runCode();
    }
});

function runCode() {
    const code = editor.value;
    if (!code.trim()) {
        output.innerHTML = '<span class="warn">No code to run.</span>';
        return;
    }

    // Check for basic syntax errors
    const openBraces = (code.match(/\{/g) || []).length;
    const closeBraces = (code.match(/\}/g) || []).length;
    if (openBraces !== closeBraces) {
        output.innerHTML = `<span class="error">error[E0101]: mismatched braces\n  found ${openBraces} opening and ${closeBraces} closing\n  help: check your block delimiters</span>`;
        return;
    }

    output.innerHTML = '<span class="info">Compiling...</span>';

    setTimeout(() => {
        const result = simulateRun(code);
        let html = `<span class="sep">────────────────────────────────────────</span>\n`;
        html += `<span class="info">  Compiled main.ltl (${code.split('\n').length} lines)</span>\n`;
        html += `<span class="sep">────────────────────────────────────────</span>\n\n`;

        result.lines.forEach(line => {
            if (line.type) {
                html += `<span class="${line.type}">${escHtml(line.text)}</span>\n`;
            } else {
                html += escHtml(line.text) + '\n';
            }
        });

        html += `\n<span class="sep">────────────────────────────────────────</span>\n`;
        html += `<span class="info">  Process exited (${result.elapsed}ms) — 0 errors, 0 warnings</span>\n`;

        output.innerHTML = html;
    }, 150 + Math.random() * 200);
}

function escHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function loadExample(name) {
    if (!name || !EXAMPLES[name]) return;
    editor.value = EXAMPLES[name];
    updateLineNumbers();
    updateStatus();
    output.innerHTML = '<span class="info">Example loaded — press <span class="accent">▶ Run</span> to execute.</span>';
    document.getElementById('exampleSelect').value = '';
}

function shareCode() {
    const code = editor.value;
    const encoded = btoa(unescape(encodeURIComponent(code)));
    const url = window.location.origin + window.location.pathname + '#code=' + encoded;
    document.getElementById('shareUrl').value = url;
    document.getElementById('shareModal').classList.add('active');
}

function copyShare() {
    const input = document.getElementById('shareUrl');
    input.select();
    navigator.clipboard.writeText(input.value).then(() => {
        const btn = event.target;
        btn.textContent = '✓ Copied!';
        setTimeout(() => btn.textContent = 'Copy URL', 1500);
    });
}

function formatCode() {
    // Simple auto-indent formatter
    const code = editor.value;
    const lines = code.split('\n');
    let indent = 0;
    const formatted = lines.map(line => {
        let trimmed = line.trim();
        if (trimmed.startsWith('}') || trimmed.startsWith(']') || trimmed.startsWith(')')) {
            indent = Math.max(0, indent - 1);
        }
        const result = '    '.repeat(indent) + trimmed;
        if (trimmed.endsWith('{') || trimmed.endsWith('[') || trimmed.endsWith('(')) {
            indent++;
        }
        // Handle single-line close-open like "} else {"
        if (trimmed.includes('}') && trimmed.endsWith('{')) {
            // already handled
        }
        return result;
    }).join('\n');
    editor.value = formatted;
    updateLineNumbers();
}

// ── Init ─────────────────────────────────────────────────────

// Load from URL hash if present
const hash = window.location.hash;
if (hash.startsWith('#code=')) {
    try {
        editor.value = decodeURIComponent(escape(atob(hash.slice(6))));
    } catch (e) {
        editor.value = EXAMPLES.hello;
    }
} else {
    editor.value = EXAMPLES.hello;
}

updateLineNumbers();
updateStatus();
</script>
